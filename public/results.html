<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-3xl px-4 py-8">
        <h1 class="text-2xl font-bold">Poll Results</h1>
        <p id="total" class="mb-6 text-slate-500"></p>
        <form id="keyForm" class="mb-6 hidden rounded-xl bg-white p-6 shadow">
            <label class="mb-2 block font-semibold" for="key">Admin key</label>
            <input id="key" type="password" class="w-full rounded border border-slate-300 px-3 py-2" autocomplete="off">
            <button class="mt-3 rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Show results</button>
            <p id="keyError" class="mt-2 text-sm text-red-600"></p>
        </form>
        <div id="results" class="space-y-6"></div>
    </main>

    <script>
        const form = document.getElementById("keyForm");
        const out = document.getElementById("results");
        let timer = null;

        // The key lives in sessionStorage only: it disappears when the tab closes.
        async function load() {
            const key = sessionStorage.getItem("adminKey");
            if (!key) return showForm("");
            try {
                const res = await fetch("/api/results", { headers: { "x-admin-key": key } });
                if (res.status === 401) { sessionStorage.removeItem("adminKey"); return showForm("Wrong key."); }
                if (res.status === 503) return showForm("The server has no ADMIN_KEY set.");
                if (!res.ok) throw new Error();
                form.classList.add("hidden");
                draw(await res.json());
                // Ask again every 3 seconds. This is "polling": plain and simple, no WebSockets.
                clearTimeout(timer);
                timer = setTimeout(load, 3000);
            } catch (e) {
                document.getElementById("total").textContent = "Could not reach the server. Retrying...";
                clearTimeout(timer);
                timer = setTimeout(load, 3000);
            }
        }

        function showForm(message) {
            clearTimeout(timer);
            form.classList.remove("hidden");
            document.getElementById("keyError").textContent = message;
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            sessionStorage.setItem("adminKey", document.getElementById("key").value);
            load();
        };

        function draw(data) {
            document.getElementById("total").textContent =
                data.total + (data.total === 1 ? " response" : " responses");
            out.innerHTML = "";
            data.questions.forEach((q, i) => {
                const max = Math.max(1, ...q.options.map((o) => o.count));
                const card = document.createElement("div");
                card.className = "rounded-xl bg-white p-6 shadow";
                const title = document.createElement("h2");
                title.className = "mb-3 font-semibold";
                title.textContent = `${i + 1}. ${q.text}`;
                card.appendChild(title);
                q.options.forEach((o) => {
                    const row = document.createElement("div");
                    row.className = "mb-2";
                    const label = document.createElement("div");
                    label.className = "flex justify-between text-sm";
                    const name = document.createElement("span");
                    name.textContent = o.text;
                    const count = document.createElement("span");
                    count.textContent = o.count;
                    label.append(name, count);
                    const track = document.createElement("div");
                    track.className = "h-3 rounded bg-slate-200";
                    const bar = document.createElement("div");
                    bar.className = "h-3 rounded bg-indigo-600";
                    bar.style.width = (o.count / max) * 100 + "%";
                    track.appendChild(bar);
                    row.append(label, track);
                    card.appendChild(row);
                });
                out.appendChild(card);
            });
        }

        load();
    </script>
</body>
</html>
